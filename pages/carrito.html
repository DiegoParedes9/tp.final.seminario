
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi carrito | Punto Gamer</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="container header-container">

            <a href="../index.html" class="logo">
                PUNTO <span>GAMER</span>
            </a>

            <nav class="nav">
                <a href="../index.html">Inicio</a>
                <a href="catalogo.html">Catálogo</a>
                <a href="contacto.html">Contacto</a>
            </nav>

            <div class="header-actions">

                <a href="favoritos.html">
                    Favoritos
                    <span id="contador-favoritos">0</span>
                </a>

                <a href="carrito.html">
                    Carrito
                    <span id="contador-carrito">0</span>
                </a>

                <a href="login.html">Mi cuenta</a>

            </div>

        </div>

    </header>


    <!-- CONTENIDO DEL CARRITO -->

    <main class="cart">

        <section class="page-heading">

            <div class="container">

                <span class="section-tag">TU SELECCIÓN</span>

                <h1>Mi carrito</h1>

                <p>Revisá los videojuegos que agregaste.</p>

            </div>

        </section>


        <section class="cart-section">

            <div class="container">

                <div class="cart-layout">

                    <div class="cart-items">
                        <!-- Los productos se cargan con JavaScript -->
                    </div>


                    <aside class="cart-summary">

                        <h2>Resumen de compra</h2>

                        <p>
                            Subtotal:
                            <span id="cart-subtotal">$0</span>
                        </p>

                        <p>
                            Total:
                            <span id="cart-total">$0</span>
                        </p>

                        <button
                            type="button"
                            class="btn"
                            id="btn-continuar-compra"
                            disabled
                        >
                            Continuar compra
                        </button>

                        <a
                            href="catalogo.html"
                            class="continue-shopping"
                        >
                            Seguir comprando
                        </a>

                    </aside>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="container footer-content">

            <div class="footer-brand">

                <a href="../index.html" class="logo">
                    PUNTO <span>GAMER</span>
                </a>

                <p>LEVEL UP YOUR GAME.</p>

            </div>

        </div>

        <div class="footer-bottom">

            <p>
                &copy; 2026 Punto Gamer. Todos los derechos reservados.
            </p>

        </div>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="../js/storage.js"></script>
    <script src="../js/productos.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/carrito.js"></script>

</body>

</html>
